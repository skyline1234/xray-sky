<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050812" />
  <title>X-ray Sky</title>
  <link rel="stylesheet" href="./style.css?v=20261001-2" />

  <!-- No build step: Three.js is loaded directly from a CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="title">THE X-RAY SKY</div>
    <div class="hint" id="hint">Drag to look around</div>
    <div class="coordinates" id="coordinates">l = 270.0° · b = +0.0°</div>
  </div>

  <div id="controls" aria-label="Sky controls">
    <div class="control-row image-controls">
      <div class="blend-readout" id="blendReadout">Optical (Gaia DR3) 100%</div>
      <input id="skySlider" type="range" min="0" max="5" step="0.001" value="0"
             aria-label="Blend between sky images" />
      <div class="slider-nodes" aria-label="Sky image energy bands">
        <button class="slider-node is-active" data-value="0" aria-label="Show Optical (Gaia DR3)">
          <span class="node-dot"></span><span>Optical<br>(Gaia DR3)</span>
        </button>
        <button class="slider-node" data-value="1" aria-label="Show 0.2 to 0.25 keV">
          <span class="node-dot"></span><span>0.2–0.25</span>
        </button>
        <button class="slider-node" data-value="2" aria-label="Show 0.2 to 2.3 keV">
          <span class="node-dot"></span><span>0.2–2.3</span>
        </button>
        <button class="slider-node" data-value="3" aria-label="Show 0.5 to 0.6 keV">
          <span class="node-dot"></span><span>0.5–0.6</span>
        </button>
        <button class="slider-node" data-value="4" aria-label="Show 0.6 to 0.7 keV">
          <span class="node-dot"></span><span>0.6–0.7</span>
        </button>
        <button class="slider-node" data-value="5" aria-label="Show RGB composite">
          <span class="node-dot"></span><span>RGB</span>
        </button>
      </div>
      <button id="mirrorBtn" aria-pressed="false">Mirror Full Sky</button>
    </div>
    <div class="control-row view-controls">
      <button id="exploreBtn" aria-pressed="false">Enable Motion</button>
      <button id="resetBtn">Reset View</button>
    </div>
    <div id="imageCredit">Credit: ESA/Gaia/DPAC, CC BY-SA 3.0 IGO, adapted</div>
  </div>

  <div id="status">Manual view</div>

  <script type="module" src="./main.js?v=20261001-2"></script>
</body>
</html>
