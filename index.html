<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050812" />
  <title>X-ray Sky</title>
  <link rel="stylesheet" href="./style.css?v=20260929-2" />

  <!-- No build step: Three.js is loaded directly from a CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="title">THE X-RAY SKY</div>
    <div class="hint" id="hint">Drag to look around</div>
    <div class="coordinates" id="coordinates">l = 270.0° · b = +0.0°</div>
  </div>

  <div id="controls" aria-label="Sky controls">
    <div class="control-row image-controls">
      <button id="previousImageBtn" aria-label="Previous sky image">‹</button>
      <button id="imageBtn" aria-label="Next sky image">
        <span id="imageName">0.2–2.3 keV</span>
        <span id="imageCount">1 / 1</span>
      </button>
      <button id="nextImageBtn" aria-label="Next sky image">›</button>
      <button id="mirrorBtn" aria-pressed="false">Mirror Full Sky</button>
    </div>
    <div class="control-row view-controls">
      <button id="exploreBtn" aria-pressed="false">Explore</button>
      <button id="realSkyBtn" aria-pressed="false">Real Sky</button>
      <button id="resetBtn">Reset View</button>
    </div>
  </div>

  <div id="status">Manual view</div>

  <script type="module" src="./main.js?v=20260929-2"></script>
</body>
</html>
