<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050812" />
  <title>X-ray Sky</title>
  <link rel="stylesheet" href="./style.css?v=20260929-4" />

  <!-- No build step: Three.js is loaded directly from a CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="title">THE X-RAY SKY</div>
    <div class="hint" id="hint">Drag to look around</div>
    <div class="coordinates" id="coordinates">l = 270.0° · b = +0.0°</div>
  </div>

  <div id="controls" aria-label="Sky controls">
    <div class="control-row image-controls">
      <div class="blend-readout" id="blendReadout">Optical 100%</div>
      <input id="skySlider" type="range" min="0" max="5" step="0.001" value="0"
             aria-label="Blend between sky images" />
      <div class="slider-endpoints" aria-hidden="true">
        <span>Optical</span>
        <span>RGB</span>
      </div>
      <button id="mirrorBtn" aria-pressed="false">Mirror Full Sky</button>
    </div>
    <div class="control-row view-controls">
      <button id="exploreBtn" aria-pressed="false">Enable Motion</button>
      <button id="resetBtn">Reset View</button>
    </div>
  </div>

  <div id="status">Manual view</div>

  <script type="module" src="./main.js?v=20260929-4"></script>
</body>
</html>
